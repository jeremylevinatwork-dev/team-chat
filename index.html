<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Team Chat — Loews Security</title>
<meta name="theme-color" content="#1a365d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Team Chat">
<style>
:root{--gold:#d4af37;--navy:#1a365d;--blue:#2d4a7a;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:#eef1f6;color:#222;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;}

/* header */
.chat-header{flex:0 0 auto;background:linear-gradient(135deg,#1a365d,#2d4a7a);color:#fff;padding:14px 16px;border-bottom:3px solid var(--gold);}
.chat-header h1{font-size:18px;margin:0;}
.chat-header p{font-size:12px;color:#b9c7d8;margin:4px 0 0;}
#modebar{flex:0 0 auto;display:none;gap:8px;align-items:center;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line);}
.modebtn{border:2px solid #1a365d;background:#fff;color:#1a365d;border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px;cursor:pointer;}
.modebtn.on{background:#1a365d;color:#fff;}
#clientHotel{flex:1;padding:7px 10px;border:2px solid var(--gold);border-radius:8px;font-size:13px;font-weight:600;color:#1a365d;}
.power{font-family:Georgia,'Times New Roman',serif;font-weight:bold;color:#111;font-size:13px;text-align:center;background:#fff;padding:6px;border-bottom:2px solid var(--gold);}

/* login card */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a365d 0%,#2d4a7a 100%);z-index:9999;padding:16px;}
.login-card{background:#fff;border-radius:16px;padding:28px 24px;max-width:400px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.35);text-align:center;}
.login-card h1{color:#1a365d;font-size:22px;margin:8px 0 4px;}
.login-card .sub{color:#666;font-size:13px;margin-bottom:18px;}
.login-card select{width:100%;padding:12px;margin:8px 0;border:2px solid #d4af37;border-radius:8px;font-size:16px;background:#fff;color:#222;}
.login-card button{width:100%;padding:14px;margin-top:10px;background:#d4af37;color:#1a365d;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;}
.brand-power{font-family:Georgia,'Times New Roman',serif;font-weight:bold;color:#111;font-size:16px;margin-bottom:4px;}

/* messages */
#messages{flex:1 1 auto;overflow-y:auto;padding:12px 12px 8px;display:flex;flex-direction:column;gap:8px;}
.msg{background:#fff;border-radius:12px;padding:10px 12px;max-width:85%;box-shadow:0 1px 3px rgba(0,0,0,.08);align-self:flex-start;}
.msg.mine{align-self:flex-end;background:#1a365d;color:#fff;}
.msg .who{font-size:12px;font-weight:700;color:#1a365d;margin-bottom:2px;}
.msg.mine .who{color:#d4af37;}
.msg .txt{font-size:15px;line-height:1.4;word-wrap:break-word;}
.msg .ts{font-size:11px;color:#999;margin-top:4px;}
.msg.mine .ts{color:#b9c7d8;}
.sys{text-align:center;font-size:12px;color:#888;margin:4px 0;}
#status{text-align:center;font-size:11px;color:#999;padding:4px;flex:0 0 auto;}

/* input bar */
#bar{flex:0 0 auto;display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #ddd;}
#msgin{flex:1;padding:12px;border:2px solid #d4af37;border-radius:10px;font-size:16px;}
#sendbtn{padding:12px 20px;background:#d4af37;color:#1a365d;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;}
#sendbtn:disabled{opacity:.5;cursor:default;}
#attbtn{padding:12px 14px;background:#1a365d;color:#fff;border:none;border-radius:10px;font-size:17px;cursor:pointer;}
#attbtn:disabled{opacity:.5;cursor:default;}
#attchip{flex:0 0 auto;display:none;background:#fdf6e0;border-top:1px solid #eee;padding:8px 14px;font-size:13px;color:#444;align-items:center;justify-content:space-between;gap:8px;}
#attchip button{border:none;background:none;font-size:15px;cursor:pointer;color:#b00;}
.msg img.att{max-width:240px;max-height:240px;border-radius:8px;display:block;margin-top:5px;}
.filelink{display:inline-block;margin-top:5px;padding:8px 10px;background:rgba(26,54,93,.08);border:1px solid #1a365d;border-radius:8px;color:#1a365d;font-size:13px;font-weight:600;text-decoration:none;word-break:break-all;}
.msg.mine .filelink{background:rgba(255,255,255,.15);border-color:#d4af37;color:#fff;}
#whoami{flex:0 0 auto;background:#fff;border-top:1px solid #eee;padding:6px 14px;font-size:12px;color:#666;display:flex;justify-content:space-between;align-items:center;}
#whoami button{border:none;background:none;color:#1a365d;font-size:12px;font-weight:700;cursor:pointer;text-decoration:underline;}
</style>
</head>
<body>

<div class="power">Power by: NDL systems tech</div>
<div class="chat-header">
  <h1>💬 Team Chat</h1>
  <p>Loews Security Systems — team messages</p>
</div>

<div id="login" style="display:none">
  <div class="login-card">
    <div class="brand-power">Power by: NDL systems tech</div>
    <h1>Team Chat</h1>
    <div class="sub">Please log in through the main Loews Security app first — the chat uses your team login.</div>
  </div>
</div>

<div id="whoami" style="display:none">
  <span id="whoami-name"></span>
</div>

<div id="modebar">
  <button id="mode-team" class="modebtn on" onclick="switchMode('team')">Team Chat</button>
  <button id="mode-client" class="modebtn" onclick="switchMode('client')">🏨 Client Chat</button>
  <select id="clientHotel" style="display:none" onchange="renderClientMsgs()">
    <option value="PBH">Loews Portofino Bay Hotel</option>
    <option value="HRH">Hard Rock Hotel</option>
    <option value="RPR">Loews Royal Pacific Resort</option>
    <option value="SFR">Loews Sapphire Falls Resort</option>
    <option value="AVA">Universal Aventura Hotel</option>
    <option value="CBBR">Universal Cabana Bay Beach Resort</option>
    <option value="ESS">Universal's Endless Summer Resort - Surfside</option>
    <option value="ESD">Universal's Endless Summer Resort - Dockside</option>
    <option value="SNR">Universal Stella Nova Resort</option>
    <option value="TLR">Universal Terra Luna Resort</option>
    <option value="HGH">Universal Helios Grand Hotel</option>
  </select>
</div>

<div id="messages"></div>
<div id="status"></div>

<div id="attchip"><span id="attname"></span><button onclick="clearAttach()" title="Remove attachment">&#10005;</button></div>
<div id="bar">
  <button id="attbtn" onclick="document.getElementById('filein').click()" title="Attach a photo or file">&#128206;</button>
  <input id="filein" type="file" style="display:none" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.txt,.csv">
  <input id="msgin" type="text" placeholder="Type a message…" maxlength="1000" autocomplete="off">
  <button id="sendbtn" onclick="sendMsg()">Send</button>
</div>

<script>
"use strict";
/* ---------- config ---------- */
var TEAM = ["Jeremy Levin","Alexander Duff","Dominique Black","Sean Forester","Justin Messger"];
var SB_URL = 'https://qxqrwusaynfqadjfqswe.supabase.co';
var SB_KEY = 'sb_publishable_2ba9yzEA89uqXHJ6v-_cQg_AmwwEfFF';
var ROW_ID = 'team-chat';
var MAX_MSG = 100000;
var POLL_MS = 5000;

var me = null;
var messages = [];
var pollTimer = null;
var sending = false;

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function fmtTs(ts){
  try{
    var d = new Date(ts);
    return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
  }catch(e){ return ''; }
}
function setStatus(t){ document.getElementById('status').textContent = t || ''; }

/* ---------- SSO / identity ---------- */
function getSSO(){
  try{
    if(localStorage.getItem('loewsAuth')==='1'){
      var u = localStorage.getItem('loewsUser');
      if(u && TEAM.indexOf(u) >= 0) return u;
    }
  }catch(e){}
  return null;
}
function initIdentity(){
  var sso = getSSO();
  if(sso){ startChat(sso); return; }
  // Login required — identity comes only from the main app's team login (loewsAuth)
  document.getElementById('login').style.display = 'flex';
}
function logout(){
  me = null;
  if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
  document.getElementById('whoami').style.display = 'none';
  document.getElementById('modebar').style.display = 'none';
  document.getElementById('login').style.display = 'flex';
}
function startChat(name){
  me = name;
  document.getElementById('whoami-name').textContent = 'Chatting as: ' + name;
  document.getElementById('whoami').style.display = 'flex';
  document.getElementById('modebar').style.display = 'flex';
  loadMsgs();
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(function(){ if(chatMode === 'client') loadClientMsgs(); else loadMsgs(); }, POLL_MS);
}

/* ---------- Supabase ---------- */
function sbHeaders(json){
  var h = {'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY};
  if(json) h['Content-Type'] = 'application/json';
  return h;
}
async function loadMsgs(){
  setStatus('Loading…');
  try{
    var res = await fetch(SB_URL + '/rest/v1/app_records?id=eq.' + encodeURIComponent(ROW_ID) + '&select=data', {headers: sbHeaders(false)});
    if(!res.ok){ setStatus('Could not load messages'); return; }
    var rows = await res.json();
    var arr = [];
    if(rows && rows.length && rows[0].data && Array.isArray(rows[0].data.messages)) arr = rows[0].data.messages;
    messages = arr.slice(-MAX_MSG);
    renderMsgs();
    setStatus('');
  }catch(e){
    setStatus('Offline — will retry');
  }
}
async function saveMsgs(){
  try{
    var payload = {id: ROW_ID, app: 'team-chat', data: {messages: messages.slice(-MAX_MSG)}, updated_at: new Date().toISOString()};
    await fetch(SB_URL + '/rest/v1/app_records', {
      method: 'POST',
      headers: Object.assign(sbHeaders(true), {'Prefer': 'resolution=merge-duplicates'}),
      body: JSON.stringify(payload)
    });
  }catch(e){ /* will retry on next poll/send */ }
}

/* ---------- client chat (separate from team chat) ---------- */
var CLIENT_ROW = 'client-chat';
var chatMode = 'team';
var clientMessages = [];
function switchMode(m){
  chatMode = m;
  document.getElementById('mode-team').classList.toggle('on', m === 'team');
  document.getElementById('mode-client').classList.toggle('on', m === 'client');
  document.getElementById('clientHotel').style.display = (m === 'client') ? '' : 'none';
  document.getElementById('attbtn').style.display = (m === 'client') ? 'none' : '';
  document.getElementById('msgin').placeholder = (m === 'client') ? 'Reply to the hotel…' : 'Type a message…';
  document.getElementById('messages').dataset.init = '';
  if(m === 'client') loadClientMsgs(); else loadMsgs();
}
async function loadClientMsgs(){
  try{
    var res = await fetch(SB_URL + '/rest/v1/app_records?id=eq.' + encodeURIComponent(CLIENT_ROW) + '&select=data', {headers: sbHeaders(false)});
    if(!res.ok) return;
    var rows = await res.json();
    var arr = [];
    if(rows && rows.length && rows[0].data && Array.isArray(rows[0].data.messages)) arr = rows[0].data.messages;
    clientMessages = arr.slice(-MAX_MSG);
    if(chatMode === 'client') renderClientMsgs();
  }catch(e){ setStatus('Offline — will retry'); }
}
async function saveClientMsgs(){
  try{
    var payload = {id: CLIENT_ROW, app: 'client-chat', data: {messages: clientMessages.slice(-MAX_MSG)}, updated_at: new Date().toISOString()};
    await fetch(SB_URL + '/rest/v1/app_records', {
      method: 'POST',
      headers: Object.assign(sbHeaders(true), {'Prefer': 'resolution=merge-duplicates'}),
      body: JSON.stringify(payload)
    });
  }catch(e){ /* will retry on next poll/send */ }
}
function renderClientMsgs(){
  var box = document.getElementById('messages');
  var hotel = document.getElementById('clientHotel').value;
  var list = clientMessages.filter(function(m){ return m.hotel === hotel; });
  var nearBottom = (box.scrollHeight - box.scrollTop - box.clientHeight) < 120;
  var start = Math.max(0, list.length - 300);
  var h = '';
  for(var i = start; i < list.length; i++){
    var m = list[i];
    var mine = (m.fromSupport === true);
    h += '<div class="msg' + (mine ? ' mine' : '') + '">'
      + '<div class="who">' + esc(m.name) + (m.fromSupport ? ' · Support' : '') + '</div>'
      + (m.text ? '<div class="txt">' + esc(m.text) + '</div>' : '')
      + '<div class="ts">' + esc(fmtTs(m.ts)) + '</div>'
      + '</div>';
  }
  if(!list.length) h = '<div class="sys">No client messages from this hotel yet.</div>';
  box.innerHTML = h;
  if(nearBottom || !box.dataset.init){ box.scrollTop = box.scrollHeight; box.dataset.init = '1'; }
}

/* ---------- render / send ---------- */
function renderMsgs(){
  var box = document.getElementById('messages');
  var nearBottom = (box.scrollHeight - box.scrollTop - box.clientHeight) < 120;
  var SHOW = 300; // display latest 300; full log (up to 100,000) stays saved
  var start = Math.max(0, messages.length - SHOW);
  var h = '';
  if(start > 0) h += '<div class="sys">Showing latest 300 of ' + messages.length + ' messages — full history is saved.</div>';
  for(var i=start;i<messages.length;i++){
    var m = messages[i];
    var mine = (m.name === me);
    var fileHtml = '';
    if(m.file && m.file.url){
      if((m.file.type||'').indexOf('image/') === 0){
        fileHtml = '<a href="'+esc(m.file.url)+'" target="_blank" rel="noopener"><img class="att" src="'+esc(m.file.url)+'" alt="'+esc(m.file.name||'photo')+'"></a>';
      } else {
        fileHtml = '<a class="filelink" href="'+esc(m.file.url)+'" target="_blank" rel="noopener" download>&#128196; '+esc(m.file.name||'File')+(m.file.size?' ('+fmtSize(m.file.size)+')':'')+'</a>';
      }
    }
    h += '<div class="msg'+(mine?' mine':'')+'">'
      + '<div class="who">'+esc(m.name)+'</div>'
      + (m.text ? '<div class="txt">'+esc(m.text)+'</div>' : '')
      + fileHtml
      + '<div class="ts">'+esc(fmtTs(m.ts))+'</div>'
      + '</div>';
  }
  if(!messages.length) h = '<div class="sys">No messages yet — say hi 👋</div>';
  box.innerHTML = h;
  if(nearBottom || !box.dataset.init){ box.scrollTop = box.scrollHeight; box.dataset.init = '1'; }
}
var pendingFile = null;
var MAX_FILE = 10 * 1024 * 1024; // 10 MB
function fmtSize(n){ if(!n && n!==0) return ''; if(n < 1024) return n + ' B'; if(n < 1048576) return Math.round(n/1024) + ' KB'; return (n/1048576).toFixed(1) + ' MB'; }
function clearAttach(){
  pendingFile = null;
  var fi = document.getElementById('filein'); if(fi) fi.value = '';
  var chip = document.getElementById('attchip'); if(chip) chip.style.display = 'none';
}
async function uploadFile(file){
  var safe = (file.name || 'file').replace(/[^a-zA-Z0-9._-]/g, '_');
  var path = Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '-' + safe;
  var res = await fetch(SB_URL + '/storage/v1/object/chat-files/' + encodeURIComponent(path), {
    method: 'POST',
    headers: {'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': file.type || 'application/octet-stream', 'x-upsert': 'false'},
    body: file
  });
  if(!res.ok) throw new Error('upload failed');
  return { name: file.name || 'file', url: SB_URL + '/storage/v1/object/public/chat-files/' + path, type: file.type || '', size: file.size || 0 };
}
async function sendMsg(){
  var inp = document.getElementById('msgin');
  var t = inp.value.trim();
  if((!t && !pendingFile) || !me || sending) return;
  if(chatMode === 'client'){
    if(!t) return;
    sending = true;
    document.getElementById('sendbtn').disabled = true;
    try{
      setStatus('Sending…');
      await loadClientMsgs();
      clientMessages.push({name: me, text: t, ts: new Date().toISOString(), hotel: document.getElementById('clientHotel').value, fromSupport: true});
      await saveClientMsgs();
      inp.value = '';
      renderClientMsgs();
      setStatus('');
    }catch(e){ setStatus('Could not send — will retry'); }
    sending = false;
    document.getElementById('sendbtn').disabled = false;
    return;
  }
  sending = true;
  document.getElementById('sendbtn').disabled = true;
  document.getElementById('attbtn').disabled = true;
  try{
    var fileInfo = null;
    if(pendingFile){
      setStatus('Uploading file…');
      fileInfo = await uploadFile(pendingFile);
    }
    setStatus('Sending…');
    // refresh first to avoid clobbering teammates' messages
    await loadMsgs();
    var msg = {name: me, text: t, ts: new Date().toISOString()};
    if(fileInfo) msg.file = fileInfo;
    messages.push(msg);
    messages = messages.slice(-MAX_MSG);
    renderMsgs();
    inp.value = '';
    clearAttach();
    await saveMsgs();
    setStatus('');
  }catch(e){
    setStatus('Send failed — try again');
  }
  sending = false;
  document.getElementById('sendbtn').disabled = false;
  document.getElementById('attbtn').disabled = false;
  inp.focus();
}

document.getElementById('msgin').addEventListener('keypress', function(e){ if(e.key==='Enter') sendMsg(); });
document.getElementById('filein').addEventListener('change', function(){
  var f = this.files && this.files[0];
  if(!f) return;
  if(f.size > MAX_FILE){
    setStatus('That file is too big — 10 MB max');
    clearAttach();
    return;
  }
  pendingFile = f;
  document.getElementById('attname').textContent = '📎 ' + f.name + ' (' + fmtSize(f.size) + ') — tap Send';
  document.getElementById('attchip').style.display = 'flex';
  setStatus('');
});
initIdentity();
</script>
</body>
</html>
